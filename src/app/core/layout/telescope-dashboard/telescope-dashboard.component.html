<div class="amp-shell" [attr.data-theme]="ui.theme()">
  <amp-toolbar />

  <div class="amp-main">
    <amp-sky-canvas class="amp-sky" />

    @if (ui.sidebarOpen()) {
      <button
        type="button"
        class="amp-sidebar-backdrop"
        [attr.aria-label]="t('star.close')"
        (click)="ui.setSidebarOpen(false)"
      ></button>
      <aside class="amp-sidebar amp-sidebar--overlay">
        <amp-observer-panel />
        @if (selection.selectedStarId(); as starId) {
          <amp-star-detail-card [starId]="starId" />
        }
      </aside>
    }
  </div>

  <amp-time-player />
</div>
